    <linearGradient id="of-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1" />
      <stop offset="1" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#of-gradient)" />
  <g fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="25.5" cy="36" r="14.5" />
    <path d="M25.5 15.5v6M21 14h9" />
    <path d="M46.5 50.5V36.5a5 5 0 0 1 5-5H53M39.5 40h12" />
    <path d="m19.5 36.5 4.5 4.5 8-8.5" stroke-width="4" />
  </g>
</svg>
