<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- OrdreFlow mark: a stopwatch with a check mark as the "O" and a smaller "f" whose crossbar joins the
       stopwatch ("time registered"). -->
