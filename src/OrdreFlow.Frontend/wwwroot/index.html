<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>OrdreFlow</title>
    <base href="/" />
    <meta name="theme-color" content="#0b1020" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <!-- Bump ?v= when the theme changes so browsers holding an old copy fetch the new one. -->
    <link rel="stylesheet" href="css/app.css?v=4" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=4" />
    <link rel="icon" type="image/png" sizes="48x48" href="favicon.png?v=5" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=4" />
    <link href="OrdreFlow.Frontend.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
